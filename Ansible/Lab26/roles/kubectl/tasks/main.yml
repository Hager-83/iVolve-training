---
# tasks file for roles/kubectl
- name: Install kubectl prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present

- name: Retrieve stable kubectl version
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: kubectl_version
  changed_when: false

- name: Download kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

